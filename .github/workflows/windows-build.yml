name: Windows x64 build

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Rebuild better-sqlite3 for the bundled Electron ABI
        run: npx electron-builder install-app-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Package NSIS and Portable x64
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: draw-and-guess-windows-x64
          path: |
            dist/*-win-x64-Setup.exe
            dist/*-win-x64-Portable.exe
          if-no-files-found: error
